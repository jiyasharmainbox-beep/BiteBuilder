{% extends "layout.html" %} {% block content %}
<div class="content-section py-3 px-4 mb-4">
  <h2 class="mb-4">Reset Password</h2>
  <p class="text-body-secondary">
    Enter your email address below and we'll send you a link to reset your
    password.
  </p>
  <form id="resetPasswordForm">
    <div class="mb-3">
      <label for="email" class="form-label">Email Address</label>
      <input
        type="email"
        class="form-control"
        id="email"
        name="email"
        required
        autocomplete="email"
      />
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">
      Send Reset Link
    </button>
  </form>
  <p class="mt-3">
    Remember your password? <a href="{{ url_for('login_page') }}">Login here</a>
  </p>
</div>
{% endblock content %} {% block scripts %}
<script type="module">
  import { getErrorMessage, showModal } from "/static/js/utils.js";

  const form = document.getElementById("resetPasswordForm");
  const submitBtn = document.getElementById("submitBtn");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";

    const email = document.getElementById("email").value;

    try {
      const response = await fetch("/api/users/reset-password/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });

      const data = await response.json();

      if (response.ok) {
        let message = data.message;

        // Development helper: show the reset link directly on screen.
        // Remove this block before going to production (the link should be emailed instead).
        if (data.reset_url) {
          message += `<br><br><strong>Email found</strong><br/> <a href="${data.reset_url}">Click here to reset your password</a>`;
        }

        document.getElementById("successMessage").innerHTML = message;
        showModal("successModal");
      } else {
        document.getElementById("errorMessage").textContent =
          getErrorMessage(data);
        showModal("errorModal");
      }
    } catch (error) {
      document.getElementById("errorMessage").textContent =
        "Network error. Please check your connection and try again.";
      showModal("errorModal");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Send Reset Link";
    }
  });
</script>
{% endblock scripts %}
